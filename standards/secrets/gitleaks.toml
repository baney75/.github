# Gitleaks rules for Donovan's repositories: the gitleaks default set plus the fleet patterns
# from tools/secret_scan.py that the default set misses (tools/secret_bench.py measures both).
# tools/repo_secrets.py runs gitleaks with this file. Per-repo exceptions go in the allow file
# (.github/secret-allow.toml), each with a reason, never here.

title = "fleet"

[extend]
useDefault = true

# A pinned hash is not a secret: a 40 to 128 hex value under a sha, digest, checksum or hash
# name, or an image tagged with a commit. 7 of the fleet repo's 17 default-rule findings were these.
# Anchored to the whole line, so a key elsewhere on the same line still counts, and the name must
# end in the hash word, so SHARED_SECRET or hash_key with a hex value still counts.
[[allowlists]]
description = "hash pins and commit-tagged images"
regexTarget = "line"
regexes = [
  '''(?i)^[\s"'{\[,-]*[\w.-]*(?:sha(?:1|224|256|384|512)?(?:sum)?|digest|checksum|hash)["']?\s*[:=]\s*["']?[0-9a-f]{40,128}["']?,?\s*$''',
  '''(?i)^[\s-]*image:\s*[\w./-]+:[0-9a-f]{40,64}\s*$''',
]

[[rules]]
id = "fleet-url-password"
description = "URL with a password before the host (database, git or Basic Auth URL)"
regex = '''\b[a-z][a-z0-9+.-]{1,20}://[^\s/:@'"`<>]{1,64}:([^\s/@'"`<>]{3,128})@[a-z0-9.-]+'''
secretGroup = 1
keywords = ["://"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''^(?:\$\{?\w+\}?|<[^>]*>|\{\{[^}]*\}\}|\*+|x+|\.\.\.|password|pass|passwd|pw|secret|changeme|example|redacted|REDACTED)$''',
  '''^\$''',
  '''^\d+$''',  # host:port@ (a userinfo trick in a URL test), not a password
]

[[rules]]
id = "fleet-tailscale-key"
description = "Tailscale auth, API or OAuth client key"
regex = '''\btskey-(?:auth|api|client)-[A-Za-z0-9]{6,}-[A-Za-z0-9]{20,}'''
keywords = ["tskey-"]

[[rules]]
id = "fleet-xai-key"
description = "xAI API key"
regex = '''\bxai-[A-Za-z0-9]{32,}'''
keywords = ["xai-"]

[[rules]]
id = "fleet-openrouter-key"
description = "OpenRouter API key"
regex = '''\bsk-or-v1-[a-f0-9]{64}\b'''
keywords = ["sk-or-"]

[[rules]]
id = "fleet-fal-key"
description = "fal.ai key"
regex = '''(?i)\bFAL_KEY\s*[=:]\s*["']?([A-Za-z0-9:_-]{20,})'''
secretGroup = 1
keywords = ["fal_key"]

[[rules]]
id = "fleet-discord-webhook"
description = "Discord webhook URL (anyone holding it can post)"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9_-]{60,80}'''
keywords = ["discord"]

[[rules]]
id = "fleet-password-literal"
description = "A password or secret assigned a quoted literal"
regex = '''(?i)\b(?:password|passwd|pwd|secret)["']?\s*[:=]\s*["']([^"'\s$<{]{12,})["']'''
secretGroup = 1
entropy = 3.7  # a random 20-character password scores about 4.1; doc examples like the Clerk ones 3.2 to 3.6
keywords = ["pass", "pwd", "secret"]
[[rules.allowlists]]
regexTarget = "secret"
regexes = [
  '''(?i)^(?:changeme|replace[_-]?me|placeholder|example.*|dummy.*|sample.*|your[_-].*|test.*|fake.*|redacted|x+)$''',
  '''^pass://''',
  '''(?i)redacted''',
]
